name: takip
description: "project-taskr kullanıcı uygulaması — GitHub hub istemcisi"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Zamana bağlı mantık (yoklama, rate limit beklemesi) testte sahte saatle
  # sürülebilsin diye DateTime.now() yerine clock.now() kullanılıyor.
  clock: ^1.1.1
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_markdown: ^0.7.4
  # ExtensionSet (tablo, ~~üstü çizili~~, görev listesi) için doğrudan gerekli.
  markdown: ^7.1.1
  yaml: ^3.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Yoklama zamanlayıcısını gerçek zaman beklemeden test etmek için (B-024).
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
